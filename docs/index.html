<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PTSD Research Daily &middot; 創傷後壓力研究日報</title>
<style>
  :root { --bg: #f6f1e8; --surface: #fffaf2; --line: #d8c5ab; --text: #2b2118; --muted: #766453; --accent: #8c4f2b; --accent-soft: #ead2bf; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(circle at top, #fff6ea 0, var(--bg) 55%, #ead8c6 100%); color: var(--text); font-family: "Noto Sans TC", "PingFang TC", "Helvetica Neue", Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { text-align: center; padding: 40px; }
  .logo { font-size: 64px; margin-bottom: 24px; }
  h1 { font-size: 28px; margin-bottom: 12px; color: var(--text); }
  .subtitle { color: var(--accent); font-size: 16px; margin-bottom: 32px; }
  .info { color: var(--muted); font-size: 14px; line-height: 1.8; }
  .info a { color: var(--accent); text-decoration: none; }
  .info a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">🧠</div>
  <h1>PTSD Research Daily</h1>
  <p class="subtitle">創傷後壓力研究日報 &middot; 每日自動更新</p>
  <p class="info">
    本站將在首次 GitHub Actions 執行後自動生成每日報告。<br/>
    排程時間：每日 GMT+8 07:50<br/><br/>
    <a href="https://github.com/u8901006/PTSD-research">GitHub 原始碼</a>
  </p>
</div>
</body>
</html>
